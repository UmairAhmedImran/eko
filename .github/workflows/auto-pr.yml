name: Auto PR on Push

on:
  push:
    branches-ignore:
      - main
      - master

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-pr:
    name: Open PR → main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip bot commits
        if: contains(github.event.head_commit.author.name, '[bot]')
        run: |
          echo "Bot commit — skipping auto-PR."
          exit 0

      - name: Derive PR title from branch name
        id: meta
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          # feat/add-eko-diff  →  feat: add eko diff
          SLUG=$(echo "$BRANCH" | sed -E 's|^(feat|fix|chore|docs|refactor|test|ci)/||' | tr '-' ' ')
          PREFIX=$(echo "$BRANCH" | grep -oE '^(feat|fix|chore|docs|refactor|test|ci)' || true)
          if [[ -n "$PREFIX" ]]; then
            TITLE="${PREFIX}: ${SLUG}"
          else
            TITLE="$SLUG"
          fi
          # Capitalise first letter
          TITLE="$(echo "${TITLE:0:1}" | tr '[:lower:]' '[:upper:]')${TITLE:1}"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

          # Last commit message for PR body
          echo "commit_msg=$(git log -1 --pretty=format:'%s')" >> "$GITHUB_OUTPUT"

      - name: Create PR (skip if one already exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.meta.outputs.branch }}"
          TITLE="${{ steps.meta.outputs.title }}"
          COMMIT="${{ steps.meta.outputs.commit_msg }}"

          EXISTING=$(gh pr list \
            --head "$BRANCH" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number' 2>/dev/null || echo "")

          if [[ -n "$EXISTING" ]]; then
            echo "PR #$EXISTING already exists for '$BRANCH' — skipping."
            exit 0
          fi

          BODY="## 📝 Summary
${COMMIT}

---

## ✅ Checklist
- [ ] Code builds and tests pass (\`go test -v ./...\`)
- [ ] New code is covered by tests
- [ ] Docs updated if needed

---
> 🤖 Auto-opened when branch \`${BRANCH}\` was pushed."

          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "$TITLE" \
            --body "$BODY")

          echo "✔ PR created: $PR_URL"
