name: Sync Good First Issues Badge

on:
  issues:
    types: [opened, closed, labeled, unlabeled, reopened]
  workflow_dispatch:       # allow manual trigger from GitHub UI

permissions:
  contents: write
  pull-requests: write

jobs:
  update-badge:
    name: Update README badge
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Count open "good first issue" issues
        id: count
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(gh issue list \
            --repo "${{ github.repository }}" \
            --label "good first issue" \
            --state open \
            --limit 500 \
            --json number \
            --jq 'length')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Open good first issues: $COUNT"

      - name: Update badge in README.md
        run: |
          COUNT="${{ steps.count.outputs.count }}"
          CURRENT=$(grep -oE 'Good%20First%20Issues-[0-9]+%20Open' README.md | grep -oE '[0-9]+' | head -1 || echo "0")

          if [[ "$CURRENT" == "$COUNT" ]]; then
            echo "Badge already shows $COUNT — no change needed."
            exit 0
          fi

          sed -i \
            "s|Good%20First%20Issues-[0-9]*%20Open|Good%20First%20Issues-${COUNT}%20Open|g" \
            README.md

          echo "Badge updated: $CURRENT → $COUNT"

      - name: Commit badge update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet README.md; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: sync Good First Issues badge → ${{ steps.count.outputs.count }} open [skip ci]"
          git push
